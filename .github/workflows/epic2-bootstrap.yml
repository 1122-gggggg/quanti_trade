name: Apply Epic 2 Bundle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/epic-2-backend-data-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-2-backend-data-platform
          fetch-depth: 0

      - name: Verify and apply bundle
        shell: bash
        run: |
          set -euo pipefail
          cat tools/epic2.bundle.part-* > /tmp/epic2.bundle.b64
          base64 -d /tmp/epic2.bundle.b64 > /tmp/epic2.tgz
          echo "e0e09ad0f392266a0d1f1d758a8d67b2d4d69d076df29b31045928a1c87b3537  /tmp/epic2.tgz" | sha256sum -c -
          tar -xzf /tmp/epic2.tgz
          rm -f tools/epic2.bundle.b64 tools/epic2.bundle.part-*
          rmdir tools 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and deterministic engine
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:platform
          npm run check:platform
          npm run build
          docker compose config

      - name: Validate complete backend stack
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d --build db postgrest redis minio minio-init api worker
          npm run test:integration

      - name: Collect platform diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --no-color db postgrest redis minio api worker > platform-services.log 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic2-bootstrap-platform-services
          path: platform-services.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop backend platform
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Commit platform source
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/epic2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Epic 2 backend data platform"
          git push origin HEAD:agent/epic-2-backend-data-platform
